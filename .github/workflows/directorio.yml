name: Directorio de clubes DSA

# Descarga la lista oficial de clubes de Conquistadores (clubes.adventistas.org) y la publica
# en la rama `datos-directorio` como JSON. Supabase la importa sola desde ahí (sin claves).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 2 * *'   # día 2 de cada mes

permissions:
  contents: write

concurrency:
  group: directorio-dsa
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar el directorio (despacio)
        run: python3 scripts/directorio_dsa.py directorio_dsa.json
      - name: Revisar que esté completo
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('directorio_dsa.json', encoding='utf-8'))
          n = len(d['clubes'])
          print('clubes:', n, 'asociaciones:', len(d['asociaciones']), 'regiones:', len(d['regiones']))
          assert len(d['uniones']) >= 10 and len(d['asociaciones']) >= 60 and n >= 3000, 'Directorio incompleto: no se publica'
          EOF
      - name: Publicar en la rama datos-directorio
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir publicar && mv directorio_dsa.json publicar/ && cd publicar
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b datos-directorio
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Directorio DSA $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" datos-directorio
