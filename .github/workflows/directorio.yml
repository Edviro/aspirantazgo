name: Directorio de clubes DSA

# Descarga, DESPACIO y por partes, la lista oficial de clubes de Conquistadores (clubes.adventistas.org)
# y la publica en la rama `datos-directorio` como JSON. Supabase la importa sola desde ahí (sin claves).
# Cada corrida trabaja hasta ~4 h 30 min (o hasta que el sitio pida calma) y guarda su avance; la siguiente
# (cada 2 h) sigue desde ahí. El sitio deja leer ~10 páginas por vez, así que se avanza de a poco. Cuando el directorio
# está completo, las corridas terminan en segundos (no piden nada al sitio) hasta el mes siguiente.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'

permissions:
  contents: write

concurrency:
  group: directorio-dsa
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Traer el avance anterior
        run: |
          mkdir -p datos
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/datos-directorio/estado_directorio.json" -o datos/estado_directorio.json \
            || { rm -f datos/estado_directorio.json; echo "Sin avance anterior: empieza de cero"; }
          ls -la datos
      - name: Descargar (despacio, hasta 4 h 30 min)
        env:
          LIMITE_MIN: '270'
        run: python3 scripts/directorio_dsa.py datos
      - name: Publicar en la rama datos-directorio
        if: hashFiles('datos/sin_cambios') == ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 -c "import json; d=json.load(open('datos/directorio_dsa.json', encoding='utf-8')); print('clubes:', len(d['clubes']), 'completo:', d['completo'])"
          cd datos
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          rm -rf .git
          git init -q -b datos-directorio
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add directorio_dsa.json estado_directorio.json vercel.json
          git commit -q -m "Directorio DSA $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" datos-directorio
